	<h1>form 사용하기</h1>
	<form action="./20260727.html" method="get" autocomplete="off">
	<!-- 'input'에서 'placeholder'는 입력창에 나타내는 문구 , 'maxlength'는 글자수 제한-->
	<!-- form 내부에 정보를 입력하고 제출 버튼 클릭시 'action'이 지정한 페이지로 정보를가지고 넘어감 -->
	<!-- 'autocomplate'는 자동완성기능 -->
		<label for="txtip">text</label>
		<br>
		<input id="txtip" type="text" placeholder="5자 이하" maxlength="5">
		<br>
		<br>
		<label for="pwdIp">password</label>
		<br>
		<input id="pwdIp" type="password" placeholder="4자 이상" minlength="4">
		<br>
		<br>
		<label for="srchIp">search</label>
		<br>
		<input id="srchIp" type="search">
		<br>
		<br>
		<label for="tlIP">tel</label>
		<br>
		<input id="tlIP" type="tel">
		<br>
		<br>
		<button type="submit">제출</button>
		<button type="reset">초기화</button>
	</form>

	<h1>fieldset 사용하기</h1>

		</fieldset>
		<fieldset >
			<legend>부반장</legend>
			<label for="name_2">이름</label>
			<input id="name_2" name="name_2" type="text">
			<br><br>
			<label for="age_2">나이</label>
			<input id="age_2" name="age_2" type="number">
		</fieldset>
		<fieldset disabled><!-- 'disabled' 사용할수 없음 -->
							<!-- 'input'에 'value'를 주어질시 미리 입력되어있음 -->
			<legend>서기</legend>
			<label for="name_3">이름</label>
			<input id="name_3" name="name_3" type="text" value="홍길동">
			<br><br>
			<label for="age_3">나이</label>
			<input id="age_3" name="age_3" type="number">
		</fieldset>
	</form>

	<h1>다른 input 타입 요소 사용하기</h1>
	<label for="raIp">range</label><br>
	<input id="raIP" type="range" min="0" max="100" step="1"><br><br>
	
	<label for="dtIp">date</label><br>
	<input id="dtIp" type="date" min="2020-01-01" max="2030-12-31"><br><br>
	
	<label>check</label><br>
	<input id="cbIp" type="checkbox" value="gohome" checked><label for="cbIp">칼퇴하기</label>
	<input id="cbIp2" type="checkbox" value="study"><label for="cbIp2">남아서 공부하기</label><br><br>
	<!-- 'chckbox'는 체크표시 여러개 선택(다중선택) 'checked'는 미리 체크표시 -->
	
	<label>radio</label><br>
	<input id="rdIp" name="gender" type="radio" value="M"><label for="rdIp">남</label>
	<input id="rdIp2" name="gender" type="radio" value="F"><label for="rdIp2">여</label><br><br>
	<!-- 'radio'의 경우 'name'을 같은걸로 주어지면 해당이름으로 묶인것중 한개만 선택됨 (단일선택) -->
	<label>가장 좋아하는 과일</label><br>
	<input id="rdIp3" name="fruit" type="radio"><label for="rdIp3">사과</label>
	<input id="rdIp4" name="fruit" type="radio"><label for="rdIp4">바나나</label>
	<input id="rdIp5" name="fruit" type="radio"><label for="rdIp5">포도</label><br><br>
	<hr>
	<h1>input 연습하기</h1>
	<form action="#">
		<label for="valIp">value</label><br><!-- 'value'클릭시 valIp로지정된 id로 이동 -->
		<input id="valIp" type="text" value="지정됨"><br><br>
		
		<label for="afIp">autofocus</label><br>
		<input id="afIp" type="text" placeholder="자동 포커스됨" autofocus><br><br>
		
		<label for="roIp">readonly</label><br>
		<input id="roIp" type="text" value="읽기만 가능, 전송됨" readonly><br><br>
		
		<label for="daIp">disabled</label><br>
		<input id="daIp" type="text" placeholder="입력 불가, 전송 안 됨" disabled><br><br>
		
		<label for="rqIp">required</label><br>
		<input id="rqIp" type="text" placeholder="필수 입력!" required><br><br>
		
		<input type="radio" name="fruit" id="f_apple" value="apple" checked><label for="f_apple">사과</label>
