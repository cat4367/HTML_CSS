<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
	ul > li:not(:last-child){
		border-bottom: 1px solid blue;
	}
</style>
</head>
<body><!-- style="text-align: center;" -->
	<!-- 화면 기준으로 크기를 줄때 vw, vh 사용함 -->
	<!-- margine[padding,border] 영역 입력시 순서 margin(값4): 위 오른 아래 왼 순으로 입력하거나 margin(값2): 위아래 좌우
	margin(값1): 전부공통	margin(값3): 위 좌우 아래 -->
	<!-- 영역에 auto값 입력시 자동으로 화면을기준으로 가운데 맞춤 -->
	<!-- div 자체를 가운데 정렬하고싶을때 display 속성에 따라 가운 데 정렬하는 방법이 다름
	display : block(기본값) -> margin으로 정렬
	display : inline-block -> 상위 요소에 text-align속성으로 정렬
	 -->
	<div style="width: 30%; background-color: red; margin: 0 auto;">
		안녕하세여</div><br>
	<div style="width: 30%; background-color: #4287f5; border: 2px dashed #000000;">안녕하세여</div><br>
	<!-- border 선 종류 solid(실선) dashed(파선) dotted(점선) -->
	<div style="width: 30%; background-color: green;">안녕하세여</div>
	<hr>
	<div style="width: 200px; height: 200px; background-color: orangered; margin: 0 auto;">
	<!-- span에 똑같이 주게될경우 block이 아니라 원하는대로 안나옴 -->
	안녕하세요
	</div>
	<hr>
	<ul>
		<li>ul 아이템 1</li>
		<li>ul 아이템 2</li>
		<li>ul 아이템 3</li>
		<li>ul 아이템 4</li>
		<li>ul 아이템 5</li>
	</ul>
	<hr>
	
	<div style="width:500px; height:500px; padding:10px; border:3px solid black; margin : 5px; box-sizing: border-box; border-radius: 50%;"></div>
</body>
</html>
