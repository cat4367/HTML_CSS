<textarea rows="30" cols="100" disabled>
		제 1 장 총 칙
제 1 조 (목적)
이 약관은 전기통신사업법령, 정보통신망이용촉진등에관한법령 및 개인정보보호법에 의하여 사단법인 한국사회복지정책학회(이하 "학회"라 한다)가 제공하는 한국사회복지정책학회 홈페이지 사이트 서비스(이하 "서비스"라 한다)의 이용조건 및 절차에 관한 사항을 규정함을 목적으로 합니다.
제 2 조 (약관의 공지 및 준용)
①이 약관의 내용은 서비스 화면에 게시하거나 기타의 방법으로 회원에게 공지함으로써 효력을 발생 합니다.
②학회는 이 약관을 임의로 변경할 수 있으며, 변경된 약관은 제 1항과 같은 방법으로 공지함으로써 효력을 발생합니다.
제 3 조 (약관 외 준칙)
이 약관에 명시되지 않은 사항은 전기통신기본법, 전기통신사업법, 정보통신망이용촉진등에관한법률, 개인정보보호법 및 기타 관련 법령의 규정에 의합니다.
제 4 조 (용어의 정의)
이 약관에서 사용하는 용어의 정의는 다음과 같습니다.
① 회원 : 학회와 서비스 이용계약을 체결하고 이용자 아이디를 부여받은 자
② 아이디(ID) : 회원 식별과 회원의 서비스 이용을 위하여 회원이 선정하고 학회가 승인하는 문자와 숫자의 조합
③ 비밀번호 : 회원의 비밀 보호를 위해 회원 자신이 설정한 문자와 숫자의 조합
④ 운영자 : 서비스의 전반적인 관리와 원활한 운영을 위하여 학회에서 선정한 사람
⑤ 해지 : 학회 또는 회원이 서비스 개통 후 이용계약을 해약 하는 것
제 2 장 서비스 이용계약
제 5 조 (이용계약의 성립)
① "위의 이용약관에 동의하여 회원 가입을 승인하십니까?" 라는 물음에 회원이 "동의함" 단추를 누르 면 이 약관에 동의하는 것으로 간주됩니다.
② 서비스 이용계약은 회원의 이용신청에 대하여 학회가 심사 후 승낙함으로써 성립합니다.
제 6 조 (이용신청)
① 이용신청은 온라인으로 학회 소정의 가입신청 양식에서 요구하는 사항을 기록하여 신청합니다.
② 온라인 가입신청 양식에 기재하는 모든 회원 정보는 실제 데이터인 것으로 간주하며 실명이나 실제 정보를 입력하지 않은 사용자는 법적인 보호를 받을 수 없으며, 서비스 사용의 제한을 받을 수 있 습니다.
제 7 조 (회원정보 사용에 대한 동의)
①회원의 개인 정보에 대해서는 개인정보보호법에 의하여 어떠한 경우에도 보호가 됩니다.
② 학회가 제6조에 따라 신청서에 기재를 요구하는 회원의 개인정보는 본 이용계약의 이행과 본 이용 계약상의 서비스제공을 위한 목적으로만 이용합니다.
③ 회원이 학회 및 학회와 제휴한 서비스들을 편리하게 이용할 수 있도록 하기 위해 회원 정보는 학 회와 제휴한 업체에 제공될 수 있습니다. 단, 학회는 회원 정보 제공 이전에 제휴 업체, 제공 목적, 제공할 회원 정보의 내용 등을 사전에 공지하고 회원의 동의를 얻어야 합니다.
④ 회원은 회원정보 수정을 통해 언제든지 개인 정보에 대한 열람 및 수정을 할 수 있습니다.
⑤ 회원이 이용신청서에 회원정보를 기재하고, 학회에 본 약관에 따라 이용신청을 하는 것은 학회가 본 약관에 따라 이용신청서에 기재된 회원정보를 수집, 이용 및 제공하는 것에 동의하는 것으로 간주 됩니다.
제 8 조 (이용신청의 승낙)
① 학회는 회원이 제 6조에서 정한 모든 사항을 정확히 기재하여 이용신청을 하였을 때 제2호, 제3호의 경우를 예외로 하여 승낙할 수 있습니다.
② 학회는 다음 각 호의 1에 해당하는 이용신청에 대하여는 승낙을 유보할 수 있습니다.
가. 설비에 여유가 없는 경우
나. 기술상 지장이 있는 경우
다. 기타 학회의 사정상 이용승낙이 곤란한 경우
③ 학회는 다음 각 호의 1에 해당하는 이용신청에 대하여는 이를 승낙하지 아니 할 수 있습니다.
가. 이름이 실명이 아닌 경우
나. 다른 사람의 명의를 사용하여 신청한 경우
다. 이용신청시 필요내용을 허위로 기재하여 신청한 경우
라. 사회의 안녕질서 또는 미풍양속을 저해할 목적으로 신청한 경우
마. 기타 학회가 정한 이용신청요건이 미비되었을 때

</textarea>
