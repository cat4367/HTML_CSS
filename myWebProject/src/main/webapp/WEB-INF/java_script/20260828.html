<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>요소 조작하기2</title>
<style>
body {
	padding: 16px 32px;
}
a, input, label {
	display: inline-block;
	margin-bottom: 1em;
	font-size: 1.24em;
}
</style>
</head>
<body>
	<a href="https://www.naver.com" target="_blank">🔗웹사이트 바로가기</a>
	<br>
	<input type = "text" name="message" value="Hello World!">
	<br>
	<input type ="checkbox" id="checkbox" name="toggle">
	<label for="checkbox">체크 박스</label>
</body>
<script>
const $hyperlink = document.querySelector('a');
console.log($hyperlink);

console.log($hyperlink.getAttribute('href'));
$hyperlink.setAttribute('href','https://www.yalco.kr');		// 링크변경
$hyperlink.setAttribute('class','soldout sweet');			// 클래스 삽입
$hyperlink.setAttribute('style','margin:10px; border:1px solid #000;');			// 스타일 삽입
console.log($hyperlink.getAttribute('class'));

const $message = document.querySelector('input[name=message]');
const $toggle = document.querySelector('input[name=toggle]');
console.log($message);
console.log($toggle);

$message.value = '안녕하세요';
// $toggle.checked = !$toggle.checked; 실행 할때마다 체크박스의 체크를 껏다 켰다 함.




</script>
</html>
