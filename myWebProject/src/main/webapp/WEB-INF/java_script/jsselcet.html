<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
  	body {
  		padding: 36px 32px;
  	}
  	section {
  		margin: 12px 0;
  		padding: 9px 24px;
  		background-color: bisque;
  		border-radius: 12px;
  	}
  	section.plant {
  		background-color: lightgreen;
  	}
  	.soldout {
  		display:none;
  	}
  	
  	.organic::after{
  		content : " (유기농)";
  	}
  </style>
  <title>요소 선택하기</title>
</head>
<body>
  <h1>장보기 목록</h1>

  <section id="veg" class="plant">
    <h2>채소</h2>
    <ul>
      <li>당근</li>
      <li>오이</li>
      <li class="soldout">양파</li>
    </ul>
  </section>
  <section id="sweets" class="plant">
    <h2>과일</h2>
    <ul>
      <li id="apple">사과</li>
      <li>딸기</li>
      <li>포도</li>
    </ul>
  </section>
  <section>
    <h2>고기</h2>
    <ul>
      <li class="soldout">소고기</li>
      <li>돼지고기</li>
      <li class="soldout">닭고기</li>
    </ul>
  </section>
  
</body>
  <script>
  const $listItems = document.getElementsByTagName('section');
  console.log($listItems);
  
  const $plantList = document.getElementsByClassName('plant');
  console.log($plantList);
  
  const $sweet = document.getElementById('apple');
  console.log($sweet); 
  $sweet.textContent = '맛있는 사과';
  
  const $selector = document.querySelector('section.plant');
  console.log($selector);
  
  const $onion = document.querySelector('#veg ul').lastElementChild;
  console.log($onion);
  $onion.classList.remove('soldout');
  $onion.classList.add('organic');
  
  $onion.style['color'] = 'red';
  $onion.style.color = 'green';
  
  const $ul =document.querySelector('#veg > ul');
  $ul.removeChild($onion);						// 요소가 완전히 사라짐
  
  while($ul.firstElementChild){					// 요소가 아무것도 안남을때까지 삭제 반복
	  $ul.removeChild($ul.firstElementChild);
  }
  
  const $tomato = document.createElement('li');	// <li><li>
  $tomato.textContent = '토마토';					// <li>토마토<li>
  console.log($tomato);
  
  $ul.appendChild($tomato);
  
  const veges = ['상추','가지','브로콜리'];
  for(const item of veges){
	  const $el = document.createElement('li');
	  $el.textContent = item;
	  $ul.appendChild($el);
  };
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  </script>
</html>
